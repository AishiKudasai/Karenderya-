<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karenderya POS & Table Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-area">
      <div class="brand-logo">KN</div>
      <div class="brand-title">
        <h1 id="header-restaurant-name">Aling Nena's Karenderya</h1>
        <p>Filipino Home-Cooked Meals POS</p>
      </div>
    </div>
    <div class="header-meta">
      <div class="meta-item">Date/Time: <span id="header-datetime">--</span></div>
      <div class="meta-item">Cashier: <span id="header-staff-name">Ate Maria</span></div>
      <div class="meta-item">Storage: <span>Local Storage</span></div>
      <button class="btn btn-orange" id="quick-new-order-btn" style="padding: 0.3rem 0.7rem; font-size:0.8rem;">+ New Order</button>
    </div>
  </header>

  <!-- App Container -->
  <div class="app-container">
    <!-- Navigation Rail -->
    <nav class="nav-rail">
      <a href="#" class="nav-item active" data-view="dashboard">Dashboard</a>
      <a href="#" class="nav-item" data-view="tables">Table Management</a>
      <a href="#" class="nav-item" data-view="ordering">Food Ordering</a>
      <a href="#" class="nav-item" data-view="orders">Orders</a>
      <a href="#" class="nav-item" data-view="customers">Customers</a>
      <a href="#" class="nav-item" data-view="menu">Menu Management</a>
      <a href="#" class="nav-item" data-view="billing">Billing & Payments</a>
      <a href="#" class="nav-item" data-view="receipts">Receipt History</a>
      <a href="#" class="nav-item" data-view="settings">Settings</a>
    </nav>

    <!-- Main Content View -->
    <main class="main-content" id="main-view-container">
      <!-- Dynamically loaded views -->
    </main>
  </div>

  <!-- Main Entry Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
