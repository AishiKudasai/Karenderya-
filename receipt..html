<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Karenderya POS - Receipt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="app">
    <nav id="side-menu">
      <strong class="logo">K</strong>
      <a id="link-floor" href="index.html" class="active"><span>▦</span>Table</a>
      <a id="link-orders" href="orders.html"><span>☰</span>Orders</a>
      <a id="link-menu" href="menu.html"><span>✎</span>Menu</a>
      <a id="link-receipts" href="receipts.html"><span>▤</span>Receipts</a>
      <a id="link-settings" href="settings.html"><span>⚙</span>Setup</a>
    </nav>
    <header id="top-bar">
      <strong id="shop-name"></strong>
      <span id="date-time"></span>
      <span>Cashier: <b id="cashier-name"></b></span>
      <button onclick="newTakeaway()">+ Takeaway</button>
    </header>
    <main id="receipt-page">
      <section class="paper">
        <h2 id="receipt-title"></h2>
        <article id="receipt-paper">
          <header>
            <strong id="r-shop"></strong>
            <p id="r-address"></p>
            <p id="r-phone"></p>
            <strong id="r-heading"></strong>
          </header>
          <table>
            <tr><td>Receipt</td><td id="r-no"></td></tr>
            <tr><td>Orders</td><td id="r-orders"></td></tr>
            <tr><td>Date</td><td id="r-date"></td></tr>
            <tr><td>Cashier</td><td id="r-cashier"></td></tr>
          </table>
          <table><tbody id="r-items"></tbody></table>
          <p id="r-discount-status"></p>
          <table>
            <tr><td>Subtotal</td><td id="r-subtotal"></td></tr>
            <tr><td>Discount</td><td id="r-discount"></td></tr>
            <tr><td><b>Amount due</b></td><td id="r-due"></td></tr>
            <tr><td>Paid now</td><td id="r-paid"></td></tr>
            <tr><td>Cash received</td><td id="r-cash"></td></tr>
            <tr><td>Change</td><td id="r-change"></td></tr>
            <tr><td>Total paid</td><td id="r-total-paid"></td></tr>
            <tr><td><b>Balance</b></td><td id="r-balance"></td></tr>
            <tr><td>Method</td><td>Cash</td></tr>
          </table>
          <footer id="r-footer"></footer>
        </article>
        <p class="buttons no-print">
          <button class="light-button" onclick="window.print()">Print</button>
          <button class="light-button" onclick="downloadReceipt()">Download</button>
        </p>
        <p class="buttons no-print">
          <button id="back-history" class="red-button" onclick="showPage('receipts')" hidden>Back to history</button>
          <button id="back-table" class="red-button" onclick="showPage('order')" hidden>Back to table</button>
          <button id="finish-button" class="red-button" onclick="finishCheckout()" hidden>Finish checkout</button>
        </p>
      </section>
    </main>
  </section>
  <script src="js/common.js"></script>
  <script src="js/receipt.js"></script>
  <script>loadData();</script>
</body>
</html>
