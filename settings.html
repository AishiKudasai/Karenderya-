<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Karenderya POS - Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="app">
    <nav id="side-menu">
      <a id="link-floor" href="index.html"><span>▦</span>Tables</a>
      <a id="link-orders" href="orders.html"><span>☰</span>Orders</a>
      <a id="link-menu" href="menu.html"><span>✎</span>Menu</a>
      <a id="link-receipts" href="receipts.html"><span>▤</span>Receipts</a>
      <a id="link-settings" href="settings.html" class="active"><span>⚙</span>Settings</a>
    </nav>
    <header id="top-bar">
      <strong class="logo">K</strong>
      <strong id="shop-name"></strong>
      <span id="date-time"></span>
      <span class="cashier"><i id="avatar"></i>Cashier: <b id="cashier-name"></b></span>
    </header>
    <main id="settings">
      <section class="paper">
        <h2>Settings</h2>
        <table class="list"><tbody>
          <tr><td>Restaurant name</td><td id="set-name"></td><td><button class="small light-button" onclick="editShop('name')">Edit</button></td></tr>
          <tr><td>Address</td><td id="set-address"></td><td><button class="small light-button" onclick="editShop('address')">Edit</button></td></tr>
          <tr><td>Phone</td><td id="set-phone"></td><td><button class="small light-button" onclick="editShop('phone')">Edit</button></td></tr>
          <tr><td>Cashier</td><td id="set-cashier"></td><td><button class="small light-button" onclick="editShop('cashier')">Edit</button></td></tr>
          <tr><td>Receipt footer</td><td id="set-footer"></td><td><button class="small light-button" onclick="editShop('footer')">Edit</button></td></tr>
          <tr><td>Discount rate (%)</td><td id="set-discount"></td><td><button class="small light-button" onclick="editDiscount()">Edit</button></td></tr>
        </tbody></table>
        <p class="muted">Every bill starts with NO discount. On the Bill page, the Discount button applies this rate (for example for senior or PWD customers).</p>
        <h2>Tables</h2>
        <table class="list"><tbody id="table-rows"></tbody></table>
        <p class="buttons"><button class="light-button" onclick="addTable()">+ Add table</button></p>
      </section>
    </main>
  </section>
  <script src="js/common.js"></script>
  <script src="js/settings.js"></script>
  <script>loadData();</script>
</body>
</html>
